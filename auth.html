<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aoun Tech Account</title><link rel="stylesheet" href="aoun-tech.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>main{max-width:460px;margin:80px auto;padding:28px}form{border:1px solid var(--line);border-radius:15px;padding:28px}input,select{display:block;width:100%;padding:13px;margin:8px 0 17px;border:1px solid var(--line);border-radius:8px;font:inherit}button{border:0;width:100%;cursor:pointer}.message{color:var(--muted);font-size:13px}</style></head><body><main><a class="logo" href="index.html"><b>A</b> Aoun Tech</a><h1 id="heading">Join Aoun Tech</h1><p class="message">Create a student or client account.</p><form id="form"><label id="nameField">Full name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><label id="roleField">Account type<select id="role"><option value="student">Student</option><option value="client">Client</option></select></label><button class="btn" id="submit">Create account</button><p class="message" id="message"></p></form><p class="message"><a id="switch" href="auth.html?mode=login">Already have an account? Log in</a></p></main><script>const c=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),login=new URLSearchParams(location.search).get('mode')==='login',q=x=>document.querySelector(x);if(login){q('#heading').textContent='Welcome back';q('#submit').textContent='Log in';q('#nameField').style.display='none';q('#roleField').style.display='none';q('#switch').href='auth.html?mode=signup';q('#switch').textContent='Need an account? Sign up'}q('#form').onsubmit=async e=>{e.preventDefault();q('#message').textContent='Please wait…';const email=q('#email').value,password=q('#password').value;if(login){const r=await c.auth.signInWithPassword({email,password});q('#message').textContent=r.error?.message||'Login successful';if(!r.error)location.href='dashboard.html'}else{const r=await c.auth.signUp({email,password,options:{data:{full_name:q('#name').value,role:q('#role').value}}});q('#message').textContent=r.error?.message||'Account created. Check your email to confirm.'}}</script></body></html>
