<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aoun Tech Control Center</title><link rel="stylesheet" href="aoun-tech.css"><style>body{background:#f5f8fc}.admin{max-width:1180px;margin:auto;padding:38px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:24px;margin-bottom:18px;box-shadow:0 8px 25px #10203308}.panel h2{margin-top:0}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}label{font-size:12px;font-weight:700;color:var(--muted)}input,textarea,select{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}textarea{min-height:90px}.status{font-size:13px;color:var(--muted)}.hide{display:none}.danger{background:#ffecef;color:#bd3147;border:0;border-radius:8px;padding:10px 14px}@media(max-width:700px){.fields{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px;flex-direction:column}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="admin"><section id="login" class="panel" style="max-width:430px;margin:80px auto"><a class="logo" href="index.html"><b>A</b> Aoun Tech</a><h1>Owner control center</h1><p class="status">Private access for the Aoun Tech owner account.</p><input id="password" type="password" placeholder="Your Supabase password"><button class="btn" id="loginBtn" style="border:0;margin-top:10px;cursor:pointer">Secure login</button><p id="loginError" class="status"></p></section><section id="app" class="hide"><div class="top"><div><label>AOUN TECH / OWNER</label><h1>Control center</h1></div><button class="danger" id="logout">Log out</button></div><div class="panel"><h2>Website settings</h2><div class="fields"><label>Hero title<input id="heroTitle"></label><label>Course price<input id="coursePrice"></label><label>Hero description<textarea id="heroDescription"></textarea></label><label>Roadmap description<textarea id="roadmapDescription"></textarea></label><label>Email<input id="email"></label><label>WhatsApp link<input id="whatsapp"></label><label>LinkedIn link<input id="linkedin"></label><label>Primary theme color<input id="themePrimary" type="color" value="#155eef"></label></div><button class="btn" id="saveContent" style="border:0;margin-top:18px;cursor:pointer">Save website settings</button><p class="status" id="contentStatus"></p></div><div class="panel"><h2>Projects</h2><div id="projects"></div><button class="btn" id="addProject" style="border:0;cursor:pointer">Add project</button><button class="btn" id="saveProjects" style="border:0;cursor:pointer">Save projects</button><p class="status" id="projectStatus"></p></div><div class="panel"><h2>Learning content</h2><div class="fields"><label>Course title<input id="courseTitle" value="AI + Data Skills"></label><label>Module list<textarea id="modules" placeholder="Excel essentials&#10;SQL foundations&#10;Python + Pandas&#10;Power BI dashboards"></textarea></label><label>Handbook/resource URL<input id="handbookUrl" placeholder="PDF, video or resource link"></label><label>Announcement<textarea id="announcement" placeholder="Message shown to students"></textarea></label></div><button class="btn" id="saveLearning" style="border:0;margin-top:18px;cursor:pointer">Save learning content</button><p class="status" id="learningStatus"></p></div></section></main><script src="admin.js"></script></body></html>
