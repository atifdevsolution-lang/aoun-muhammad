<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Admin | Aoun</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; padding: 32px 20px; }
    .admin-shell { max-width: 980px; margin: auto; position: relative; z-index: 1; }
    .admin-header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:24px; }
    .admin-header h1 { margin:0; }
    .admin-panel { background:rgba(16,19,40,.82); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:24px; margin-bottom:20px; }
    .admin-panel h2 { margin-top:0; }
    .project-row { display:grid; grid-template-columns: 90px 1fr 1fr 100px; gap:12px; align-items:center; margin:12px 0; }
    input, textarea { width:100%; box-sizing:border-box; background:#0d1024; color:#fff; border:1px solid rgba(255,255,255,.14); border-radius:10px; padding:12px; font:inherit; }
    textarea { min-height:80px; resize:vertical; }
    button { border:0; border-radius:10px; padding:12px 16px; cursor:pointer; font-weight:700; }
    .primary { background:#8b5cf6; color:#fff; } .danger { background:#5b2331; color:#fff; }
    .muted { color:#a9acc2; } #editor { display:none; }
    @media (max-width:700px) { .project-row { grid-template-columns:1fr; } .admin-header { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <div class="background"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span></div>
  <main class="admin-shell">
    <div class="admin-header"><div><p class="muted">Aoun Portfolio</p><h1>Admin Panel</h1></div><a class="secondary-btn" href="index.html">View Website</a></div>
    <section id="login" class="admin-panel">
      <h2>Admin Login</h2><p class="muted">Sign in with the owner account.</p>
      <input id="password" type="password" placeholder="Admin password"><br><br><button class="primary" id="loginBtn">Login</button><p id="loginError" class="muted"></p>
    </section>
    <section id="editor">
      <div class="admin-panel"><h2>Projects</h2><p class="muted">Changes are saved in this browser and reflected on the homepage.</p><div id="projects"></div><button class="primary" id="addProject">Add project</button> <button class="primary" id="save">Save changes</button> <button class="danger" id="reset">Reset defaults</button><p id="status" class="muted"></p></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
