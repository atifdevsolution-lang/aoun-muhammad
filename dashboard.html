<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Aoun Tech</title><link rel="stylesheet" href="aoun-tech.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="page"><label>MY DASHBOARD</label><h1>Welcome to <i>Aoun Tech.</i></h1><p class="lead" id="welcome">Loading your account…</p><div class="grid"><article><strong class="icon blue">▦</strong><h3 id="roleTitle">Your learning space</h3><p id="roleText">Your courses, progress and resources will appear here.</p><a class="btn" href="courses.html">Browse courses →</a></article><article><strong class="icon green">✓</strong><h3>Profile</h3><p>Keep your account details and goals up to date.</p><a class="outline" href="auth.html?mode=login" id="logout">Log out</a></article></div></main><script>const c=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);(async()=>{const{data:{user}}=await c.auth.getUser();if(!user){location.href='auth.html?mode=login';return}const{data:p}=await c.from('profiles').select('full_name,role').eq('id',user.id).maybeSingle();const role=p?.role||'student';welcome.textContent=`Hello ${p?.full_name||user.email}. Your ${role} dashboard is ready.`;roleTitle.textContent=role==='client'?'Client workspace':'Student learning space';roleText.textContent=role==='client'?'Manage project requests, conversations and deliverables.':'Track courses, handbook resources and your learning progress.'})();logout.onclick=async e=>{e.preventDefault();await c.auth.signOut();location.href='aoun-tech.html'}</script><script src="site.js"></script></body></html>
